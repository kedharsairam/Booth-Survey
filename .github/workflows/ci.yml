name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

defaults:
  run:
    working-directory: booth-survey/android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: booth-survey
          # Full history, not a shallow one. The check reads every blob ever committed,
          # because deleting a real voter number from a file today leaves it sitting in
          # the commit before -- and a depth-1 checkout cannot see that.
          fetch-depth: 0

      - name: Checkout kraft-foundation
        uses: actions/checkout@v4
        with:
          repository: kedharsairam/kraft-foundation
          path: booth-survey/kraft-foundation

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: No electoral-roll data in the tree or in history
        run: python3 ../tools/roll-check.py

      - name: Quality gate
        run: node ../kraft-foundation/tools/kraft-lint/kraft-lint.js . --format github

      - name: Build, test and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
